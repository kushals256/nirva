services:
  - type: web
    name: voice-coding-tutor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://nirva-seven.vercel.app,https://frontend-nine-ashen-18.vercel.app
